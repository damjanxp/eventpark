# Local EventPark stack. Start:  docker compose up -d     Stop:  docker compose down   (add -v to wipe data)
#
# Compose puts every service on one private network ("eventpark_default") with built-in DNS:
# containers reach each other by service name (postgres:5432, valkey:6379, ...).
# `ports:` additionally publishes a port on YOUR machine so host tools (uv run, a DB GUI, the browser)
# can reach it. "127.0.0.1:" in front means "only from this machine", not from other devices on your network.
#
# Values like ${POSTGRES_PASSWORD} come from the repo-root .env (copy .env.example).

name: eventpark

# Settings shared by every container built from the backend image (api, init, later relay + workers).
# "x-" = an extension field Compose ignores; "&backend-env" names it so services can reuse it with "*backend-env".
# Set explicitly instead of `env_file: .env`: the .env URLs point at localhost:5433 (for tools on your machine),
# but inside the Compose network Postgres is postgres:5432 and Valkey is valkey:6379.
x-backend-env: &backend-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://valkey:6379/0
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}  # per process: total = processes x (size + overflow) <= Postgres max_connections
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  FAKEPAY_WEBHOOK_SECRET: ${FAKEPAY_WEBHOOK_SECRET:?set FAKEPAY_WEBHOOK_SECRET in .env}
  FAKEPAY_URL: http://fakepay:8000  # server to server, inside the Compose network
  FAKEPAY_PUBLIC_URL: http://localhost:8100  # what a browser can open (checkout page)
  WEBHOOK_BASE_URL: http://api:8000  # where fakepay delivers webhooks
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
  AWS_REGION: eu-central-1
  AWS_DEFAULT_REGION: eu-central-1
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-eventpark-local}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-eventpark-local-secret}
  AWS_ENDPOINT_URL_S3: http://seaweedfs:8333
  AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
  S3_PUBLIC_ENDPOINT_URL: http://localhost:8333  # what your browser can reach, used to sign URLs (§14 gotcha)
  BUCKET_FILES: ${BUCKET_FILES:-eventpark-files}
  QUEUE_URL_ENTRY_EVENTS: http://elasticmq:9324/000000000000/entry-events
  QUEUE_URL_EXIT_EVENTS: http://elasticmq:9324/000000000000/exit-events
  QUEUE_URL_NOTIFICATIONS: http://elasticmq:9324/000000000000/notifications
  QUEUE_URL_REPORTS: http://elasticmq:9324/000000000000/reports
  QUEUE_URL_MAINTENANCE: http://elasticmq:9324/000000000000/maintenance
  SMTP_URL: smtp://mailpit:1025  # every email lands in the Mailpit inbox: http://localhost:8025

services:
  postgres:
    # Pinned version, same major as RDS on AWS (Phase 11).
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # HOST:CONTAINER. Inside the Compose network Postgres is always postgres:5432; on your machine it's
      # localhost:${POSTGRES_HOST_PORT} (5433 by default, because a Windows Postgres service often holds 5432).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data  # named volume: survives `down`, deleted by `down -v`
    healthcheck:
      # $$ = a literal $ for the shell inside the container (Compose would otherwise substitute it).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    # Redis-compatible; ElastiCache runs Valkey on AWS.
    image: valkey/valkey:8.1.10-alpine
    # No persistence on purpose: Redis only holds data we can rebuild from Postgres (CLAUDE.md §3).
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticmq:
    # SQS emulator. Queues + DLQs are created at startup from the config file.
    # Messages live in memory: a restart empties the queues (fine locally; real SQS is durable).
    image: softwaremill/elasticmq-native:1.7.1
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "127.0.0.1:9324:9324"  # SQS API (no web UI: since 1.7 that's a separate image we don't need yet)
    healthcheck:
      # Ready = the SQS API answers. ListQueues is the cheapest real SQS call.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9324/?Action=ListQueues"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    # S3 emulator. `server -s3` runs all SeaweedFS parts in one container plus an S3-compatible gateway.
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json  # access keys the S3 gateway accepts (dummy, local only)
      - -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"  # S3 API
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20  # SeaweedFS starts several internal servers; give it a bit longer

  mailpit:
    # Fake SMTP server: catches every email the app sends. Inbox UI: http://localhost:8025
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"  # web UI
      - "127.0.0.1:1025:1025"  # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    # One-shot job: bring the database schema up to date and create the local S3 bucket, then exit.
    # On AWS the same image runs `alembic upgrade head` as a one-off ECS task before a deploy (Phase 13);
    # buckets there come from Terraform, so the bucket script is mounted in from scripts/ (local only).
    build: ./backend
    image: eventpark-backend:local
    command: ["sh", "-c", "alembic upgrade head && python /scripts/create_local_buckets.py"]
    volumes:
      - ./scripts:/scripts:ro
      # Dev only: use the migrations from your working copy, like the api uses ./backend/src. Without this, an image
      # built before you added a migration would refuse to start ("Can't locate revision"): we hit exactly that.
      - ./backend/migrations:/app/migrations:ro
      - ./backend/src:/app/src:ro
    environment:
      <<: *backend-env
      SERVICE_NAME: init
    healthcheck:
      disable: true  # the image's healthcheck probes the API port; a migration job has none
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  api:
    build: ./backend
    image: eventpark-backend:local  # every backend role will reuse this one image (ADR-001)
    # Dev mode: same command as the image's CMD plus --reload, which restarts uvicorn when a file in src changes.
    command:
      - uvicorn
      - eventpark.app:create_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/src
    environment:
      <<: *backend-env
      SERVICE_NAME: api
    volumes:
      # Bind mount (dev only): your ./backend/src replaces the image's /app/src, so an edit on your machine is
      # seen by the container at once and --reload restarts the app. Read-only: the container can't change it.
      - ./backend/src:/app/src:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      # Wait until the dependencies' healthchecks pass, not merely until their containers have started,
      # and until init has finished successfully (the API must never run against an old schema).
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # --- `scale` profile: a second API instance + a load balancer (Phase 7: prove pub/sub fan-out) ---
  #   docker compose --profile scale up -d --wait     ->  http://localhost:8080 (Caddy, round-robin over api + api-2)
  #   api stays reachable directly on :8000, api-2 on :8001, so you can choose which instance you talk to.
  api-2:
    profiles: [scale]
    image: eventpark-backend:local
    command: ["uvicorn", "eventpark.app:create_app", "--factory", "--host=0.0.0.0", "--port=8000"]
    environment:
      <<: *backend-env
      SERVICE_NAME: api-2
    volumes:
      - ./backend/src:/app/src:ro
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      api:
        condition: service_healthy  # api builds the image and waits for init; api-2 just reuses both

  lb:
    profiles: [scale]
    image: caddy:2.10-alpine
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy

  fakepay:
    # Simulated payment provider (docs/02-architecture.md §11). Checkout page: http://localhost:8100/checkout/<id>
    build: ./fakepay
    image: eventpark-fakepay:local
    environment:
      FAKEPAY_WEBHOOK_SECRET: ${FAKEPAY_WEBHOOK_SECRET:?set FAKEPAY_WEBHOOK_SECRET in .env}
      FAKEPAY_PUBLIC_URL: http://localhost:8100
      FAKEPAY_DUPLICATE_WEBHOOK_RATE: ${FAKEPAY_DUPLICATE_WEBHOOK_RATE:-0.1}  # duplicates on purpose: we must dedupe
    ports:
      - "127.0.0.1:8100:8000"

  # --- async backbone: same image as the api, different command (ADR-001) ---
  outbox-relay:
    build: ./backend  # every backend role builds the same image (BuildKit cache: built once)
    image: eventpark-backend:local
    command: ["python", "-m", "eventpark.relay"]
    environment:
      <<: *backend-env
      SERVICE_NAME: outbox-relay
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck: &heartbeat-check
      # No HTTP port: the loop touches a file each round; stale file = stuck (ADR-026, core/heartbeat.py)
      test: ["CMD", "python", "-m", "eventpark.core.heartbeat"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    depends_on: &worker-deps
      init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy

  worker-entry:
    build: ./backend  # every backend role builds the same image (BuildKit cache: built once)
    image: eventpark-backend:local
    command: ["python", "-m", "eventpark.workers", "entry"]
    environment:
      <<: *backend-env
      SERVICE_NAME: worker-entry
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck: *heartbeat-check
    restart: unless-stopped
    depends_on: *worker-deps

  worker-exit:
    build: ./backend  # every backend role builds the same image (BuildKit cache: built once)
    image: eventpark-backend:local
    command: ["python", "-m", "eventpark.workers", "exit"]
    environment:
      <<: *backend-env
      SERVICE_NAME: worker-exit
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck: *heartbeat-check
    restart: unless-stopped
    depends_on: *worker-deps

  worker-notifications:
    build: ./backend  # every backend role builds the same image (BuildKit cache: built once)
    image: eventpark-backend:local
    command: ["python", "-m", "eventpark.workers", "notifications"]
    environment:
      <<: *backend-env
      SERVICE_NAME: worker-notifications
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck: *heartbeat-check
    restart: unless-stopped
    depends_on: *worker-deps

  worker-reports:
    build: ./backend  # every backend role builds the same image (BuildKit cache: built once)
    image: eventpark-backend:local
    command: ["python", "-m", "eventpark.workers", "reports"]
    environment:
      <<: *backend-env
      SERVICE_NAME: worker-reports
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck: *heartbeat-check
    restart: unless-stopped
    depends_on: *worker-deps

  worker-maintenance:
    build: ./backend  # every backend role builds the same image (BuildKit cache: built once)
    image: eventpark-backend:local
    command: ["python", "-m", "eventpark.workers", "maintenance"]
    environment:
      <<: *backend-env
      SERVICE_NAME: worker-maintenance
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck: *heartbeat-check
    restart: unless-stopped
    depends_on: *worker-deps

  ticker:
    # Local stand-in for EventBridge Scheduler: one "tick" per minute into the maintenance queue.
    build: ./backend  # every backend role builds the same image (BuildKit cache: built once)
    image: eventpark-backend:local
    command: ["python", "-m", "eventpark.ticker"]
    environment:
      <<: *backend-env
      SERVICE_NAME: ticker
      TICK_SECONDS: ${TICK_SECONDS:-60}
      HEARTBEAT_MAX_AGE: "150"  # must exceed TICK_SECONDS (one beat per tick)
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck: *heartbeat-check
    restart: unless-stopped
    depends_on: *worker-deps

volumes:
  postgres-data:
  seaweedfs-data:
