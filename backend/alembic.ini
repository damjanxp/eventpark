# Alembic = database migrations: numbered scripts that move the schema from one version to the next.
#   uv run --env-file ../.env alembic upgrade head                           apply all pending migrations
#   uv run --env-file ../.env alembic revision --autogenerate -m "add x"     draft a new one (REVIEW IT!)
#   uv run --env-file ../.env alembic downgrade -1                           undo the last one
#
# The database URL is NOT in this file: migrations/env.py reads DATABASE_URL through our Settings,
# like the app does (12-factor config). Logging is configured there too (same JSON logs as the app).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
path_separator = os
# 20261028_<revision>_<slug>.py: files sort by creation date in the folder
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Format every newly generated migration with ruff, so it passes `ruff format --check` in CI.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
