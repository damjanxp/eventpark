# ElasticMQ = a local SQS emulator. This file creates our queues at startup, matching what Terraform
# creates on AWS (docs/02-architecture.md §6). Every queue has a dead-letter queue (DLQ): after
# 5 failed receives a message is moved there instead of being retried forever.
include classpath("application.conf")

node-address {
  protocol = http
  # "*" = build queue URLs from the host the request used (elasticmq:9324 inside Docker,
  # localhost:9324 from your laptop), so the same queue works from both places.
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict  # enforce real SQS limits (message size, batch size) so we notice early
}

generate-node-address = false

aws {
  region = eu-central-1
  accountId = 000000000000
}

queues {
  entry-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue { name = "entry-events-dlq", maxReceiveCount = 5 }
  }
  entry-events-dlq {}

  exit-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue { name = "exit-events-dlq", maxReceiveCount = 5 }
  }
  exit-events-dlq {}

  notifications {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue { name = "notifications-dlq", maxReceiveCount = 5 }
  }
  notifications-dlq {}

  reports {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue { name = "reports-dlq", maxReceiveCount = 5 }
  }
  reports-dlq {}

  maintenance {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue { name = "maintenance-dlq", maxReceiveCount = 5 }
  }
  maintenance-dlq {}
}
