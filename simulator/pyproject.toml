[project]
name = "simulator"
version = "0.1.0"
description = "EventPark traffic simulator + invariant checker (Phase 9)"
authors = [{ name = "Damjan Petrov", email = "damjanpetrov53@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "gatectl",          # the real gate client: same timeouts, retries and idempotency keys as a lane
    "httpx>=0.28.1",
    "pyyaml>=6.0.2",
    "asyncpg>=0.30.0",  # invariant checks read Postgres directly (the source of truth)
    "redis>=6.2.0",     # ... and compare the Redis read model against it
]

[project.scripts]
simulator = "simulator.__main__:main"

[tool.uv.sources]
gatectl = { path = "../gate-controller", editable = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
packages = ["simulator"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
