# Continuous Integration: on every push to main and every pull request, a fresh GitHub-hosted Linux machine
# ("runner") checks out the code and runs the same checks you run locally. A red ❌ means: don't merge.
#
# Jobs run in parallel on separate runners:
#   backend: lint + formatting + types + all tests (integration tests start real Postgres/Valkey via Docker)
#   frontend: typed client up to date, tsc, oxlint, vitest, vite build
#   simulator: lint + types + unit tests
#   stack:   "fresh clone" test: make up -> /readyz -> S3/SQS emulator smoke -> simulator smoke scenario

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code. (Deploys get their own permissions, Phase 13.)
permissions:
  contents: read

# A newer push to the same branch cancels the run that's still going for the older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"  # same uv as locally and in the Dockerfile
          enable-cache: true  # reuse downloaded packages between runs (keyed on uv.lock)

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff check ../scripts

      - name: Formatting (ruff format)
        run: uv run ruff format --check . && uv run ruff format --check ../scripts

      - name: Types (mypy)
        run: uv run mypy src

      - name: Tests (pytest, incl. testcontainers)
        run: uv run pytest

  gate-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gate-controller
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint, format, types (mypy strict)
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy

      - name: Tests (API mocked with respx)
        run: uv run pytest

  fakepay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fakepay
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint, format, types (mypy strict)
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy

      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Typed API client is up to date with the backend
        # Regenerate openapi.json + schema.d.ts from the backend's routes; any difference = someone changed the API
        # without regenerating, and the frontend may be using fields that no longer exist.
        run: |
          (cd ../backend && uv run python -m eventpark.openapi_dump ../frontend/openapi.json)
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts

      - name: Types, lint
        run: npm run typecheck && npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

  simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint, format, types (mypy strict)
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy

      - name: Tests (pure parts; the full run happens in the stack job)
        run: uv run pytest

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.23"

      - name: Start the local stack (fresh clone -> make up)
        run: make up

      - name: API is ready
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors http://localhost:8000/readyz

      - name: AWS emulators behave like S3/SQS
        run: make smoke

      - name: Simulator smoke scenario (50 cars, dropped answers) + invariants
        run: make seed && make sim SCENARIO=smoke

      - name: Simulator report
        if: always()
        run: cat simulator/reports/*.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

      - name: Logs (only if something failed)
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
